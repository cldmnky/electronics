# MNKYBOX Raspberry Pi 5 SD card layout.
#
# p1: 128 MiB FAT32 boot partition (Raspberry Pi firmware, kernel, DTBs,
#     overlays, and the mnkybox/ directory holding the first-boot secrets).
# p2: 1024 MiB ext4 root filesystem (BR2_TARGET_ROOTFS_EXT2_SIZE="1024M").
#
# The boot partition is filled from ${BINARIES_DIR}/boot (mountpoint "/boot"),
# assembled by post-build.sh: config.txt, cmdline.txt, kernel_2712.img,
# bcm2712-rpi-5-b.dtb, overlays/ and mnkybox/.

image boot.vfat {
	vfat {
		# -F 32: force FAT32. mkdosfs would otherwise pick FAT16 for 128 MiB.
		extraargs = "-F 32"
		label = "MNKYBOXBOOT"
	}
	mountpoint = "/boot"
	size = 128M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
