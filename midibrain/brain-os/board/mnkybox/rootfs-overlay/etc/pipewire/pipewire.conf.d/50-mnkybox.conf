# MNKYBOX PipeWire daemon configuration (drop-in, 48 kHz base rate).
#
# The reference audio interface is a UMC1820-class USB Audio Class device
# (snd-usb-audio, no firmware needed). The session runs at 48 kHz everywhere:
# one rate for the graph avoids resampling between the application, the
# interface and any JACK client.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 8192
}
