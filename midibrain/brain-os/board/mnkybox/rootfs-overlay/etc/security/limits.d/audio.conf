# Real-time and locked-memory limits for the audio group.
#
# This file covers sessions started through PAM (ssh logins, debugging shells).
# The PipeWire, WirePlumber and application system units set LimitRTPRIO=95 and
# LimitMEMLOCK=infinity themselves, because limits.conf does not apply to units
# started by PID 1.
@audio	-	rtprio		95
@audio	-	memlock		unlimited
