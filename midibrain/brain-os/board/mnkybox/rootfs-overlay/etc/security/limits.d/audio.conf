# Real-time and locked-memory limits for the audio group.
#
# This file covers sessions started through PAM (ssh logins, debugging shells).
# The session itself runs as systemd *user* units, and limits.conf does not
# apply to those: the limits are raised by the drop-in
# /etc/systemd/system/user@1000.service.d/limits.conf instead.
@audio	-	rtprio		95
@audio	-	memlock		unlimited
