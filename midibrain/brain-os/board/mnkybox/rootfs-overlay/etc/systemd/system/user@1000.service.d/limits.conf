# Limits for the mnkybox user manager and everything it starts (Weston,
# PipeWire, WirePlumber, pipewire-pulse, the application).
#
# A drop-in on user@1000.service is the only place where these can be raised:
# user units cannot lift RLIMIT_RTPRIO/RLIMIT_MEMLOCK above the limits the user
# manager inherited, and limits.conf only applies to PAM sessions.
[Service]
LimitRTPRIO=95
LimitMEMLOCK=infinity
LimitNOFILE=65536
