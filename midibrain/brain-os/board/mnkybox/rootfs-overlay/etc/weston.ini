# MNKYBOX Weston configuration (Weston 14, DRM backend, kiosk shell).
#
# The panel is a Waveshare 3.5inch DSI LCD (H): 480x800 portrait, used
# landscape. transform=90 rotates it to 800x480, which is the resolution the
# application UI is designed for. The [output] section has no name, so it
# applies to whichever DSI connector the kernel exposes; if the panel comes up
# unrotated, check `modetest -c` and name the connector explicitly:
#   [output]
#   name=DSI-1
#   transform=90
[core]
shell=kiosk-shell.so
xwayland=true
idle-time=0

[output]
transform=90

[libinput]
enable-tap=true
