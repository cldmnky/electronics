# MNKYBOX WirePlumber policy (drop-in for wireplumber.conf.d).
#
# Default device policy, applied at every boot (it is configuration, not app
# code):
#   1. A UMC1820-class USB Audio Class interface is the default sink and
#      source whenever it is present. WirePlumber picks the highest
#      priority.session node, so the interface is boosted above the on-board
#      devices. Measured reference (Behringer UMC1820, 2026-11-04): USB ID
#      1397:0503, ALSA card name "UMC1820", 20 playback + 18 capture
#      channels, S24_3LE/S32_LE at 44.1/48/88.2/96 kHz. PipeWire names its
#      nodes alsa_output/alsa_input.usb-...-..., so the name rules match;
#      api.alsa.card.name is the exact-match backstop.
#   2. Without it, the on-board/USB devices keep their normal priorities and
#      WirePlumber's default choice applies.
#
# Verify on hardware with `wpctl status` (the node names below must match) and
# `wpctl inspect <id> | grep priority.session`.
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_(output|input).*UMC1820.*" }
            { node.name = "~alsa_(output|input).*UMC.*1820.*" }
            { api.alsa.card.name = "UMC1820" }
        ]
        actions = {
            update-props = {
                priority.session = 2500
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_output.*" }
        ]
        actions = {
            update-props = {
                priority.session = 1000
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_input.*" }
        ]
        actions = {
            update-props = {
                priority.session = 1000
            }
        }
    }
]
