# MNKYBOX WiFi configuration template (no credentials, no country).
#
# WiFi is OFF until a country is set. The first-boot unit copies
# /boot/mnkybox/wpa_supplicant.conf to
# /etc/wpa_supplicant/wpa_supplicant-wlan0.conf and enables
# wpa_supplicant@wlan0.service only when that file contains a "country=" line.
# The regulatory database (wireless-regdb) rejects transmissions without it.
#
# Example /boot/mnkybox/wpa_supplicant.conf:
#
#   country=GB
#   network={
#       ssid="studio"
#       psk="secret"
#   }
#
# This template deliberately has no country and no network.
